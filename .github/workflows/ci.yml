name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build, vet, unit tests
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src \
            -e GOMODCACHE=/mod -e GOCACHE=/mod/gocache -e CGO_ENABLED=0 \
            caddy:2.11.9-builder-alpine \
            sh -c 'gofmt -l . && go build ./... && go vet ./... && go test -count=1 ./...'

      - name: Race detector
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src \
            -e GOMODCACHE=/mod -e GOCACHE=/mod/gocache -e CGO_ENABLED=1 \
            caddy:2.11.9-builder-alpine \
            sh -c 'apk add --no-cache gcc musl-dev && go test -race -count=1 ./...'

      - name: End-to-end
        run: tests/e2e/run.sh
